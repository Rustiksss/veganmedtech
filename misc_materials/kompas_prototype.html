const portrait=(index=0,size=42)=>`<div class="avatar ${doctors[index].style}" style="height:${size}px;width:${size}px;font-size:${Math.round(size*.49)}px" aria-label="Иллюстрация вместо фотографии">${doctors[index].emoji}</div>`;
const mbtn=(label,action,cls='main-btn')=>`<button type="button" class="${cls}" data-action="${action}">${label}</button>`;
function setRole(role){state.role=role;render()}
function setView(v){state.view=v;state.breathing=false;render()}
function setDocView(v){state.docView=v;render()}
function intro(){const doc=state.role==='doctor';const item=doc?docViews[state.docView]:views[state.view];return `<div class="eyebrow">✦ ${doc?'ИНТЕРФЕЙС ВРАЧА':'ИНТЕРФЕЙС ПАЦИЕНТА'} · ДЕМО</div><h1>${doc?'Решения — <span>за врачом.</span>':'Поддержка,<br>которая <span>рядом.</span>'}</h1><p>${doc?'Клинический обзор, сигналы риска и история пациента в одном рабочем пространстве. В приложении нет автоматического назначения лечения.':'Бережное пространство для контроля состояния, сопровождения лечения и быстрой связи с врачом — в спокойном, понятном интерфейсе.'}</p><div class="guide"><small>Сейчас открыт экран</small><strong>${item[0]} — ${item[1]}</strong><div class="pointer"><span class="arrow-bubble">↗</span>${doc?'Попробуйте раздел «Клинический сценарий» и подтверждение рассмотрения.':'Переключайте вкладки или нажмите «Нужна помощь» внизу телефона.'}</div></div><div class="features"><span class="chip">◈ Две роли</span><span class="chip">♡ Бережный UX</span><span class="chip">✧ Алертинг</span><span class="chip">✓ Контроль врача</span></div><div class="legal">В демонстрации нет сервера, отправки уведомлений, медицинских назначений или проверки лекарств. Профили и сведения вымышлены.</div>`}
function header(){return `<header class="phone-head"><div class="small-brand"><div class="mini-mark">✳</div><div><b>компас</b><small>вы не одни</small></div></div><button class="head-icon" data-action="notification" aria-label="Уведомления">♧</button></header>`}
function bottomNav(){const data=[['home','⌂','Главная'],['diary','♧','Дневник'],['treatment','✚','Лечение'],['doctors','♙','Врачи'],['profile','◯','Профиль']];return `<nav class="bottom-nav">${data.map(([key,icon,title])=>`<button class="navbtn ${state.view===key?'active':''}" data-view="${key}" aria-label="${title}"><span class="ico">${icon}</span>${title}</button>`).join('')}</nav>`}
function home(){return `<div class="screen"><div class="greeting">ВОСКРЕСЕНЬЕ · ВАШЕ ПРОСТРАНСТВО</div><h1>Привет, Саша! ☀️</h1><p class="subtext" style="margin-top:0;margin-bottom:17px">Как вы себя чувствуете сегодня?</p><div class="hero-card"><div class="title">Отметим настроение?</div><p>Это займёт всего несколько секунд.</p><div class="moods">${['😞','😕','😐','🙂','😊'].map((x,i)=>`<button class="mood ${state.mood===i?'active':''}" data-mood="${i}" aria-label="Настроение ${i+1} из 5">${x}</button>`).join('')}</div><div style="margin-top:13px;position:relative;z-index:1">${mbtn(state.moodSaved?'✓ Записано':'Сохранить самочувствие','save-mood','main-btn small-btn')}</div></div><div class="section-heading"><h2>Мой день</h2><button class="link" data-view="diary">Весь дневник ↗</button></div><div class="home-grid"><div class="surface home-tile"><span class="tile-emoji">💊</span><div class="tile-title">Приём лекарства</div><div class="tile-meta">${state.reminderTime} · по плану врача</div><div style="margin-top:10px">${mbtn(state.intakeTaken?'✓ Отмечено':'Отметить приём','take-pill','soft-btn small-btn')}</div></div><div class="surface home-tile"><span class="tile-emoji">🌱</span><div class="tile-title">2 минуты для себя</div><div class="tile-meta">Практика спокойствия</div><div style="margin-top:10px">${mbtn('Начать →','go-games','soft-btn small-btn')}</div></div></div><div class="section-heading"><h2>Ваш врач</h2><button class="link" data-view="doctors">Все специалисты ↗</button></div><div class="surface card-inline">${portrait(0)}<div style="flex:1"><div class="doctor-name">Анна Л.</div><div class="doctor-sub">Психиатр · <span class="status">● в сети (демо)</span></div></div>${mbtn('Профиль ↗','doctor-profile','soft-btn small-btn')}</div><div class="section-heading"><h2>Знакомство с терапией</h2></div><div class="surface card-inline" style="background:#f8f2ff"><div class="avatar" style="background:#ecdef8;font-size:23px">✿</div><div style="flex:1"><div class="doctor-name">Какой формат мне подойдёт?</div><div class="doctor-sub">Мини-анкета для разговора с врачом</div></div>${mbtn('→','go-therapy','soft-btn small-btn')}</div><div class="scroll-note">Данные на экране демонстрационные. Приложение не заменяет консультацию специалиста.</div></div>`}
function chart(){const values=state.moodSaved?[5,4,6,5,4,6,(state.mood+1)*2]:[5,4,6,5,4,6,5];return `<div class="mini-chart">${values.map((v,i)=>`<div class="chart-col"><div class="chart-bar" style="height:${v*7}px"></div>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</div>`).join('')}</div>`}
function diary(){return `<div class="screen"><div class="title-section"><h1>Дневник состояния</h1><div class="subtext">Маленькие записи помогают заметить изменения.</div></div><div class="surface" style="padding:16px"><div class="toggle-row"><h2>Эта неделя</h2><span class="pill-tag">Демо-динамика</span></div>${chart()}<div class="subtext" style="font-size:10px">График иллюстративный, не является результатом клинической шкалы.</div></div><div class="section-heading"><h2>Как проходит день</h2><span class="subtext">0–10</span></div><div class="surface" style="padding:17px"><div class="toggle-row"><span class="label-sm">Уровень тревоги</span><b id="anxietyValue">${state.anxiety}/10</b></div><input aria-label="Тревога" id="anxietyRange" type="range" min="0" max="10" value="${state.anxiety}" data-input="anxiety"><div class="toggle-row" style="margin-top:14px"><span class="label-sm">Качество сна</span><b id="sleepValue">${state.sleep}/10</b></div><input aria-label="Качество сна" id="sleepRange" type="range" min="0" max="10" value="${state.sleep}" data-input="sleep"><div style="margin-top:15px">${mbtn('Сохранить запись','save-diary','main-btn full')}</div></div><div class="section-heading"><h2>Шкалы и опросники</h2></div><div class="surface entry"><div><strong>Самооценка состояния</strong><small>Шкалы после проверки русской валидации и прав</small></div>${mbtn('Подробнее','show-scales','soft-btn small-btn')}</div><div class="note-box" style="margin-top:12px">Шкала Гамильтона предусмотрена в интерфейсе врача, так как проводится обученным специалистом. Результаты пациента попадают его лечащему врачу только при подключённом защищённом сервисе.</div></div>`}
function treatment(){return `<div class="screen"><div class="title-section"><h1>Моё лечение</h1><div class="subtext">Ваш план — только тот, который подтвердил врач.</div></div><div class="surface" style="padding:16px"><div class="toggle-row"><h2>Сегодня по плану</h2><span class="pill-tag">Назначено врачом</span></div><div class="card-inline" style="padding:15px 0"><div class="avatar" style="background:#e3f3e9">💊</div><div style="flex:1"><div class="doctor-name">Препарат из плана</div><div class="doctor-sub">${state.reminderTime} · дозировка в подтверждённом назначении</div></div></div>${mbtn(state.intakeTaken?'✓ Приём отмечен':'Отметить приём','take-pill','main-btn full')}</div><div class="section-heading"><h2>Напоминания</h2></div><div class="surface" style="padding:14px"><div class="toggle-row" style="gap:9px"><input type="time" id="reminderTime" aria-label="Время приёма" value="${state.reminderTime}" style="width:130px"><div style="flex:1">${mbtn(state.reminderEnabled?'✓ Настроено':'Сохранить время','save-reminder','soft-btn full small-btn')}</div></div><div class="scroll-note">Настройка времени работает в демо. Реальные уведомления не отправляются.</div></div><div class="section-heading"><h2>Безопасность</h2></div><div class="surface" style="padding:15px"><div class="toggle-row"><b style="font-size:13px">Проверка совместимости</b><span style="font-size:18px">⚑</span></div><p class="subtext" style="margin:6px 0 12px">Предварительный справочник; не принимайте решения об отмене или изменении терапии самостоятельно.</p><input id="drugName" type="text" placeholder="Название препарата" value="${escapeHtml(state.compatDrug)}" aria-label="Название препарата" style="margin-bottom:8px"><select id="pairType" aria-label="С чем проверить"><option value="alcohol" ${state.compatOther==='alcohol'?'selected':''}>Алкоголь</option><option value="another" ${state.compatOther==='another'?'selected':''}>Другое лекарство</option></select><div style="margin-top:9px">${mbtn('Проверить сочетание','check-compat','soft-btn full')}</div>${state.compatResult?`<div class="note-box peach" style="margin-top:11px"><b>⚠ Требуется проверка специалистом.</b><br>В этой демоверсии нет базы взаимодействий и заключения о совместимости. Для реального результата необходимы актуальная инструкция ГРЛС и оценка врача или фармацевта.${state.compatOther==='alcohol'?' Алкоголь может повышать риски при приёме психотропных препаратов.':''}</div>`:''}</div><div class="section-heading"><h2>История лечения</h2></div><div class="surface entry"><div><strong>Подтверждённые назначения</strong><small>Врач ведёт лекарственную историю</small></div><span class="pill-tag">Демо</span></div><div class="surface entry" style="margin-top:10px"><div><strong>Переносимость и реакции</strong><small>Нежелательные явления и аллергии</small></div>${mbtn('Открыть','go-profile','soft-btn small-btn')}</div><div class="scroll-note">Для реального приложения используются зарегистрированные в РФ препараты и инструкции ГРЛС. Никакая информация здесь не является назначением.</div></div>`}
function doctorCard(d,i){return `<div class="surface doctor-profile">${portrait(i,57)}<div style="flex:1;min-width:0"><div class="toggle-row"><strong style="font-size:13px">${d.name}</strong><span class="pill-tag ${d.online?'':'wait'}">${d.online?'● в сети':'не в сети'}</span></div><div class="doctor-sub">${d.title}</div><div class="doctor-sub">${d.work}</div><p>${d.info}</p><div style="display:flex;gap:7px;flex-wrap:wrap">${mbtn('Знакомство','meet-'+i,'soft-btn small-btn')}${d.online?mbtn('Связаться','contact-'+i,'main-btn small-btn'):''}</div></div></div>`}
function doctorsPage(){return `<div class="screen"><div class="title-section"><h1>Ваши специалисты</h1><div class="subtext">Знакомьтесь с врачами и выбирайте подходящий формат связи.</div></div><div class="note-box mint" style="margin-bottom:14px">● Статусы и профили ниже демонстрационные. Реальная доступность должна поступать из сервиса специалистов.</div>${doctors.map((d,i)=>doctorCard(d,i)).join('')}<div class="scroll-note">Фотографии, образование, место работы и право на практику должны быть проверены до публикации реальных профилей. Здесь используются иллюстрации-заглушки.</div></div>`}
function profile(){return `<div class="screen"><div class="title-section"><h1>Моя медицинская карта</h1><div class="subtext">Видна только вам и вашему лечащему врачу по установленным правам доступа.</div></div><div class="surface card-inline">${portrait(2,49)}<div><div class="doctor-name">Александра К. · 27 лет</div><div class="doctor-sub">Профиль пациента · демоданные</div></div></div><div class="section-heading"><h2>Здоровье и история</h2></div><div class="surface entry"><div><strong>История болезни</strong><small>Хронология консультаций и записей</small></div><span class="pill-tag">Демо</span></div><div class="surface entry" style="margin-top:8px"><div><strong>Лекарственная история</strong><small>Текущая терапия и завершённые курсы</small></div>${mbtn('Открыть','go-treatment','soft-btn small-btn')}</div><div class="surface entry" style="margin-top:8px"><div><strong>Аллергии и проявления</strong><small>${state.allergies.length?state.allergies.map(a=>escapeHtml(a.name)+' — '+escapeHtml(a.reaction)).join('; '):'Не указаны — важно уточнить с врачом'}</small></div>${mbtn('Добавить','allergy','soft-btn small-btn')}</div>${state.editingAllergy?`<div class="surface" style="padding:14px;margin-top:8px"><label class="label-sm" for="allergyName">Вещество / препарат</label><input type="text" id="allergyName" placeholder="Например, название препарата" style="margin:8px 0 11px"><label class="label-sm" for="allergyReaction">Как проявилась реакция?</label><textarea id="allergyReaction" rows="2" placeholder="Укажите симптомы реакции" style="margin:8px 0 10px"></textarea>${mbtn('Добавить запись','save-allergy','main-btn full')}</div>`:''}<div class="section-heading"><h2>Контакт доверенного лица</h2></div><div class="surface" style="padding:15px"><input type="text" id="trustedName" aria-label="Имя доверенного лица" placeholder="Как зовут близкого человека" value="${escapeHtml(state.trustedName)}"><input type="tel" id="trustedPhone" aria-label="Телефон доверенного лица" placeholder="Номер телефона" value="${escapeHtml(state.trustedPhone)}" style="margin-top:9px"><div style="margin-top:10px">${mbtn(state.trustedPhone?'Обновить контакт':'Добавить контакт','save-trusted','soft-btn full')}</div><div class="scroll-note">Номер хранится только в памяти этой вкладки и исчезнет после перезагрузки. В реальной версии необходимо отдельное согласие.</div></div><div class="section-heading"><h2>Экспериментальные функции</h2></div><div class="surface entry"><div><strong>Анализ состояния по голосу</strong><small>Не активирован · требуется валидация и согласие</small></div><span class="pill-tag wait">выкл.</span></div></div>`}
function therapy(){const questions=[{q:'Что для вас сейчас важнее?',a:['Разобраться с тревожными мыслями','Поговорить о переживаниях','Научиться справляться с повседневными трудностями']},{q:'Какой формат удобнее?',a:['Структурированные занятия с упражнениями','Беседы в свободном формате','Пока не знаю']},{q:'Какой темп вам комфортнее?',a:['Короткие регулярные встречи','Более глубокие длительные беседы','Обсудить со специалистом']}];const step=state.therapyStep;return `<div class="screen"><button class="back" data-view="home">← На главную</button><h1>Знакомство с психотерапией</h1><div class="subtext">Это не диагностика и не автоматический подбор лечения.</div><div class="swatch" style="margin:18px 0"><span style="width:${step>=3?100:(step+1)/3*100}%"></span></div>${step<3?`<div class="surface" style="padding:19px"><span class="label-sm" style="color:#9d8ea7">ВОПРОС ${step+1} ИЗ 3</span><h2 style="margin:12px 0">${questions[step].q}</h2>${questions[step].a.map((a,i)=>`<button class="answer-option ${state.answer===i?'active':''}" data-answer="${i}"><span style="font-size:16px">${state.answer===i?'◉':'○'}</span>${a}</button>`).join('')}<div style="margin-top:15px">${mbtn(step===2?'Посмотреть итог':'Дальше →','next-therapy','main-btn full')}</div></div>`:`<div class="surface" style="padding:20px"><div style="font-size:33px">🌷</div><h2 style="margin:9px 0">Вы сделали первый шаг</h2><p class="subtext">По ответам можно подготовить вопросы врачу о разных подходах, включая когнитивно-поведенческую и поддерживающую психотерапию. Выбор метода требует оценки специалиста.</p>${mbtn('Начать заново','reset-therapy','soft-btn full')}</div>`}<div class="note-box" style="margin-top:14px">Результат не заменяет клиническую оценку. Психотерапия обсуждается с лечащим специалистом.</div></div>`}
function games(){return `<div class="screen"><button class="back" data-view="home">← На главную</button><h1>Маленькая пауза 🌿</h1><p class="subtext">Простые упражнения для расслабления. Можно остановиться в любой момент.</p><div class="surface" style="padding:19px;text-align:center;margin-top:16px"><h2>Дышим плавно</h2><p class="subtext">Следуйте ритму круга, только если вам комфортно.</p><div style="padding:28px 0"><div class="breath ${state.breathing?'running':''}"><span>Вдох · выдох</span></div></div>${mbtn(state.breathing?'Приостановить':'Начать практику','toggle-breath','main-btn full')}</div><div class="section-heading"><h2>Заземление</h2></div><div class="surface" style="padding:15px"><p class="subtext" style="margin-top:0">Найдите вокруг себя три предмета и отмечайте их:</p><div class="ground-grid">${['1 предмет','2 предмет','3 предмет'].map((a,i)=>`<button class="ground-tile ${state.ground.includes(i)?'done':''}" data-ground="${i}">${state.ground.includes(i)?'✓ ':''}${a}</button>`).join('')}</div>${state.ground.length===3?'<div class="note-box mint" style="margin-top:11px">Готово. Обратите внимание на то, что чувствуете сейчас.</div>':''}</div><div class="section-heading"><h2>Мини-викторина дня</h2></div><div class="surface" style="padding:15px"><div class="label-sm">Как мягко вернуть внимание в настоящий момент?</div>${['Назвать несколько предметов вокруг','Стараться силой подавить любую мысль','Не обращать внимания на базовые потребности'].map((a,i)=>`<button class="answer-option ${state.quizAnswer===i?'active':''}" data-action="quiz-${i}">${a}</button>`).join('')}${state.quizAnswer!==-1?`<div class="note-box mint" style="margin-top:11px">${state.quizAnswer===0?'Верно! Наблюдение за окружающим — пример техники заземления.':'Бережный вариант — отметить несколько предметов вокруг. Это одна из техник заземления.'}</div>`:''}</div><div class="note-box peach" style="margin-top:15px">При непосредственной угрозе безопасности упражнения не заменяют экстренную помощь.</div></div>`}
function crisis(){return `<div class="screen"><button class="back" data-view="home">← На главную</button><div class="crisis-hero"><div style="font-size:25px">♡</div><h1>Помощь рядом</h1><p>Вам не нужно справляться с тяжёлым моментом в одиночку. Выберите следующий безопасный шаг.</p></div><div class="crisis-phone"><div><b class="emergency-number">112</b><small>Экстренные службы · Россия</small></div><a href="tel:112" class="danger-btn">☎ Позвонить</a></div><div class="note-box peach" style="margin-bottom:13px">При непосредственной опасности для жизни или безопасности позвоните в экстренную службу. Номер региональной кризисной линии зависит от вашего местоположения.</div><div class="surface" style="padding:14px"><div class="toggle-row"><div><b style="font-size:13px">Доверенное лицо</b><div class="doctor-sub">${state.trustedPhone?escapeHtml(state.trustedName||'Близкий человек')+' · '+escapeHtml(state.trustedPhone):'Контакт пока не добавлен'}</div></div>${state.trustedPhone?`<a href="tel:${encodeURIComponent(state.trustedPhone)}" class="soft-btn small-btn">Позвонить</a>`:mbtn('Добавить','go-profile','soft-btn small-btn')}</div></div><div class="section-heading"><h2>Врачи в сети</h2><button class="link" data-view="doctors">Все ↗</button></div>${doctorCard(doctors[0],0)}<div class="quote">«Даже очень сложное чувство меняется со временем. Сейчас можно сосредоточиться только на ближайшем шаге».</div><div class="section-heading"><h2>Карта помощи</h2></div><div class="fake-map"><b>Выберите город для поиска</b></div><div class="surface" style="padding:12px;margin-top:8px"><label class="label-sm" for="crisisCity">Город для поиска центров</label><select id="crisisCity" style="margin:9px 0"><option value="">Выбрать город</option><option value="Москва">Москва</option><option value="Санкт-Петербург">Санкт-Петербург</option><option value="Казань">Казань</option></select>${mbtn('Открыть поиск центров на карте ↗','open-map','soft-btn full')}<div class="scroll-note">Это только макет карты: адреса и доступность центров здесь не определяются.</div></div><div class="section-heading"><h2>Что можно сделать сейчас</h2></div>${mbtn('🌿 Дыхание и упражнение на внимание','go-games','soft-btn full')}<div class="surface" style="padding:13px;margin-top:12px"><div class="label-sm">Демонстрация алертинга врачу</div><p class="subtext">Покажите на презентации хакатона, как критический сигнал появляется в кабинете врача.</p>${mbtn(state.alert?'✓ Сигнал создан локально':'Смоделировать тревожный сигнал','simulate-alert','danger-btn full')}<div class="scroll-note">Важно: в прототипе сигнал не отправляется никому и не заменяет обращение за срочной помощью.</div></div></div>`}
function patient(){return `<div class="orb"></div><span class="sparkle s1">✺</span><span class="sparkle s2">✳</span><div class="phone">${header()}<main class="app-scroll" id="appScroll" data-current-view="${state.view}">${({home,diary,treatment,doctors:doctorsPage,profile,crisis,therapy,games}[state.view]||home)()}</main><button type="button" class="crisis-row" data-view="crisis">♡ Мне нужна помощь прямо сейчас ↗</button>${bottomNav()}</div>`}
function docSide(){return `<aside class="dash-side"><div class="side-brand"><span class="mini-mark">✳</span> компас<span style="color:#aa9db2;font-size:9px">PRO</span></div><div class="nav-section">РАБОЧЕЕ МЕСТО</div>${[['overview','◫  Обзор'],['patients','♙  Пациенты'],['scenario','✚  Сценарий'],['sources','☷  Источники']].map(([v,label])=>`<button class="${state.docView===v?'active':''}" data-doc-view="${v}">${label}</button>`).join('')}<div class="side-foot">🔒 Разграничение доступа<br>Только демонстрация<br>Без передачи данных</div></aside>`}
function dashHeader(title,sub){return `<div class="dash-head"><div><small>${sub}</small><h2>${title}</h2></div><div class="doc-badge"><span class="dot"></span> Врач · демороль</div></div>`}
function alertCard(){return `<div class="doc-alert"><div style="font-size:21px">⚑</div><div style="flex:1"><b>${state.alert?'Критический сигнал — обязательно':'Пример критического алерта — обязательно'}</b><p>Александра К. · ${state.alert?'Сигнал сформирован в пациентском интерфейсе':'Учебный пример: обнаружены признаки потенциального кризиса'}. Необходима оценка врача и протокол срочной маршрутизации.</p><div class="doc-cta">${mbtn(state.alertReviewed?'✓ Рассмотрено':'Отметить рассмотренным','review-alert','danger-btn small-btn')}<span class="status-text">${state.alert?'Сигнал виден только в демоверсии':'Учебный режим · без отправки'}</span></div></div></div>`}
function docOverview(){return `${dashHeader('Панель наблюдения','РАБОЧЕЕ ПРОСТРАНСТВО / ОБЗОР')}<div class="dash-stats"><div class="stat"><small>Пациентов в демо</small><b>12</b></div><div class="stat"><small>Критические сигналы</small><b>${state.alert?1:0}</b></div><div class="stat"><small>Отчёт о приёме</small><b>${state.intakeTaken?'5/5':'4/5'}</b></div></div><div class="doc-section-title">Обратите внимание <span class="flag must">ОБЯЗАТЕЛЬНО</span></div>${alertCard()}<div class="doc-section-title">Пациенты под наблюдением</div><div class="doc-patient">${portrait(2)}<div style="flex:1"><b>Александра К.</b><small>27 лет · дневник обновлён · приверженность: ${state.intakeTaken?'5/5':'4/5'}</small></div>${mbtn('Карточка →','open-patient','soft-btn small-btn')}</div><div class="doc-patient">${portrait(1)}<div style="flex:1"><b>Пациент Б.</b><small>Демонстрационный профиль · плановое наблюдение</small></div><span class="pill-tag">Стабильно</span></div><div class="doc-section-title">Маршрутизация</div><div class="note-box peach"><span class="flag maybe">ЖЕЛАТЕЛЬНО</span> Повторное клиническое обследование и решение о необходимости консультации психиатра. Только после подтверждения врача.</div>`}
function docPatients(){return `${dashHeader('Карточка пациента','ПАЦИЕНТЫ / АЛЕКСАНДРА К.')}<div class="doc-panel"><div style="display:flex;align-items:center;gap:11px">${portrait(2,50)}<div><h3 style="margin:0">Александра К. · 27 лет</h3><p style="margin:5px 0">Привязка к лечащему врачу · вымышленный профиль</p></div></div><div class="doc-grid" style="margin-top:17px"><div class="doc-field"><small>Самочувствие сегодня</small><b>${state.moodSaved?['Очень тяжело','Сложно','Нейтрально','Неплохо','Хорошо'][state.mood]:'Нет новой отметки'}</b></div><div class="doc-field"><small>Лечение</small><b>План подтверждается врачом</b></div><div class="doc-field"><small>Тревога (самоотчёт)</small><b>${state.anxiety}/10</b></div><div class="doc-field"><small>Приверженность (демо)</small><b>${state.intakeTaken?'Приём отмечен':'Ожидается отметка'}</b></div><div class="doc-field"><small>Аллергии и проявления</small><b>${state.allergies.length?state.allergies.map(a=>escapeHtml(a.name)+': '+escapeHtml(a.reaction)).join('; '):'Не уточнены'}</b></div><div class="doc-field"><small>Доверенный контакт</small><b>${state.trustedPhone?'Указан':'Не указан'}</b></div></div></div><div class="doc-section-title">Оценка состояния</div><div class="doc-grid"><div class="doc-panel" style="margin:0"><h3>Динамика настроения</h3>${chart()}<p>График демонстрационный, не диагноз.</p></div><div class="doc-panel" style="margin:0"><h3>Врачебные шкалы</h3><p>Шкала Гамильтона: заполняется обученным врачом после проверки русскоязычной версии и лицензии.</p>${mbtn('Открыть сценарий','open-scenario','soft-btn small-btn')}</div></div>`}
function docScenario(){return `${dashHeader('Клинический сценарий','ОБЯЗАТЕЛЬНЫЙ КЕЙС / АВИАНДР')}<div class="note-box" style="margin-top:20px"><b>Демонстрационный маршрут принятия решения:</b> клинический профиль → оценка шкал и рисков → сверка лекарственной инструкции → решение врача. Никаких автоматических назначений.</div><div class="doc-panel"><h3>01 / Профиль пациента</h3><div class="doc-grid"><div class="doc-field"><small>Пациент</small><b>Александра К. · 27 лет</b></div><div class="doc-field"><small>Симптоматика</small><b>Тревожная и депрессивная (учебная)</b></div><div class="doc-field"><small>Индивидуальные риски</small><b>Аллергии и противопоказания не уточнены</b></div><div class="doc-field"><small>История лечения</small><b>Требует сопоставления с назначениями</b></div></div></div><div class="doc-panel"><h3>02 / Рассмотрение терапии</h3><div class="toggle-row" style="align-items:flex-start"><p style="margin:0;max-width:400px"><b style="color:#5e4b73">Препарат «Авиандр»</b> фигурирует в обязательном клиническом кейсе. Показания, противопоказания, дозировки и взаимодействия должны быть подтверждены по действующей инструкции ГРЛС.</p><span class="flag must">ПРОВЕРИТЬ</span></div><div class="note-box peach" style="margin-top:14px"><b>Данных недостаточно для рекомендации.</b> Нельзя назначать или изменять терапию до проверки клинических данных и подтверждения врачом.</div></div><div class="doc-panel"><h3>03 / Маршрутизация</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="flag must">ОБЯЗАТЕЛЬНО · при признаках критического состояния</span><span class="flag maybe">ЖЕЛАТЕЛЬНО · при показаниях после оценки</span></div><p>Конкретная категория выбирается после врачебной оценки по утверждённому протоколу. Автоматическое направление не создаётся.</p><div class="doc-cta">${mbtn(state.scenarioReviewed?'✓ Сценарий просмотрен':'Подтвердить просмотр врачом','review-scenario','main-btn')}<span class="status-text">Это не медицинское назначение</span></div></div>`}
function docSources(){return `${dashHeader('Источники и безопасность','КЛИНИЧЕСКАЯ ОБОСНОВАННОСТЬ')}<div class="doc-panel" style="margin-top:20px"><h3>До клинического использования</h3><ul class="source-list"><li>Сверить действующие клинические рекомендации, одобренные Минздравом РФ.</li><li>Подключить действующие инструкции лекарственных препаратов из ГРЛС.</li><li>Проверить источники русскоязычной валидации и лицензии психометрических шкал.</li><li>Утвердить признаки критического состояния и алгоритм эскалации с клиницистами.</li><li>Реализовать согласия, аудит доступа, безопасность данных и уведомления.</li><li>Подтвердить право медицинской организации и специалистов на оказание помощи.</li></ul></div><div class="doc-section-title">Статус модулей</div>${[['Опросники и шкалы','Источник/лицензия не подключены'],['Препараты и Авиандр','ГРЛС: подключение требуется'],['Алертинг','Только симуляция в браузере'],['Передача пациент → врач','Локальная иллюстрация без сервера']].map(([a,b])=>`<div class="doc-patient"><div style="flex:1"><b>${a}</b><small>${b}</small></div><span class="pill-tag wait">демо</span></div>`).join('')}`}
function doctor(){return `<div class="dashboard-place"><div class="dash">${docSide()}<main class="dash-body">${({overview:docOverview,patients:docPatients,scenario:docScenario,sources:docSources}[state.docView])()}</main></div></div>`}
function render(){const oldScroll=document.querySelector('#appScroll');const keep=oldScroll&&oldScroll.dataset.currentView===state.view&&state.role==='patient';const scrollY=keep?oldScroll.scrollTop:0;document.querySelector('#intro').innerHTML=intro();document.querySelector('#appPlace').innerHTML=state.role==='patient'?patient():doctor();if(keep&&document.querySelector('#appScroll'))document.querySelector('#appScroll').scrollTop=scrollY;document.querySelectorAll('#roleSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role))}
function toast(msg){let existing=document.querySelector('#demoToast');if(existing)existing.remove();const t=document.createElement('div');t.id='demoToast';t.style='position:fixed;z-index:100;left:50%;bottom:25px;transform:translateX(-50%);background:#514265;color:white;padding:13px 17px;border-radius:14px;font-size:13px;box-shadow:0 15px 25px #3a2f4a30;max-width:min(360px,90vw);line-height:1.45;text-align:center';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role){setRole(role.dataset.role);return}const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return}const dv=e.target.closest('[data-doc-view]');if(dv){setDocView(dv.dataset.docView);return}const mood=e.target.closest('[data-mood]');if(mood){state.mood=+mood.dataset.mood;state.moodSaved=false;render();return}const ans=e.target.closest('[data-answer]');if(ans){state.answer=+ans.dataset.answer;render();return}const ground=e.target.closest('[data-ground]');if(ground){const i=+ground.dataset.ground;state.ground=state.ground.includes(i)?state.ground.filter(v=>v!==i):[...state.ground,i];render();return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;
switch(a){case'save-mood':if(state.mood<0){toast('Сначала выберите настроение');return}state.moodSaved=true;render();toast('Настроение отмечено в демоверсии');break;case'take-pill':state.intakeTaken=!state.intakeTaken;render();toast(state.intakeTaken?'Приём отмечен в демоверсии':'Отметка о приёме отменена');break;case'go-games':setView('games');break;case'go-therapy':setView('therapy');break;case'go-profile':setView('profile');break;case'go-treatment':setView('treatment');break;case'doctor-profile':setView('doctors');break;case'go-home':setView('home');break;case'save-diary':toast('Запись сохранена только в текущем сеансе');break;case'show-scales':toast('Для релиза нужно подключить валидированную русскоязычную версию и соблюдать условия использования');break;case'notification':toast('Уведомления в демоверсии не отправляются');break;case'check-compat':state.compatDrug=document.querySelector('#drugName')?.value||'';state.compatOther=document.querySelector('#pairType')?.value||'alcohol';state.compatResult=true;render();break;case'save-trusted':state.trustedName=document.querySelector('#trustedName')?.value||'';state.trustedPhone=document.querySelector('#trustedPhone')?.value||'';render();toast('Контакт сохранён в памяти вкладки; никому не отправлен');break;case'allergy':state.editingAllergy=!state.editingAllergy;render();break;case'save-allergy':{const name=document.querySelector('#allergyName')?.value.trim();const reaction=document.querySelector('#allergyReaction')?.value.trim();if(!name||!reaction){toast('Заполните аллерген и проявления реакции');return}state.allergies.push({name,reaction});state.editingAllergy=false;render();toast('Запись внесена в демонстрационную карту');break;}case'save-reminder':state.reminderTime=document.querySelector('#reminderTime')?.value||'21:00';state.reminderEnabled=true;render();toast('Время сохранено; реальные уведомления не отправляются');break;case'next-therapy':if(state.answer===null){toast('Выберите вариант ответа');return}state.therapyAnswer.push(state.answer);state.therapyStep++;state.answer=null;render();break;case'reset-therapy':state.therapyStep=0;state.therapyAnswer=[];state.answer=null;render();break;case'toggle-breath':state.breathing=!state.breathing;render();break;case'simulate-alert':state.alert=true;state.alertReviewed=false;render();toast('Алерт создан только в демо. Перейдите в роль «Врач», чтобы увидеть его.');break;case'open-map':{const city=document.querySelector('#crisisCity')?.value||'';if(!city){toast('Выберите город');return}window.open('https://yandex.ru/maps/?text='+encodeURIComponent(city+' кризисная психологическая помощь'),'_blank','noopener,noreferrer');break}case'review-alert':state.alertReviewed=!state.alertReviewed;render();toast('Изменился только статус демонстрационного сигнала');break;case'open-patient':setDocView('patients');break;case'open-scenario':setDocView('scenario');break;case'review-scenario':state.scenarioReviewed=!state.scenarioReviewed;render();toast('Врач ознакомился со сценарием. Назначений не создано.');break;default:if(a.startsWith('quiz-')){state.quizAnswer=+a.split('-')[1];render()}else if(a.startsWith('meet-')){const i=+a.split('-')[1];toast(doctors[i].name+': '+doctors[i].info)}else if(a.startsWith('contact-')){toast('В прототипе нет подключения к врачу. Используйте только настоящие проверенные контакты.')}}
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='anxiety'){state.anxiety=+e.target.value;const n=document.querySelector('#anxietyValue');if(n)n.textContent=state.anxiety+'/10'}if(e.target.dataset.input==='sleep'){state.sleep=+e.target.value;const n=document.querySelector('#sleepValue');if(n)n.textContent=state.sleep+'/10'}});
render();
</script>
</body>
</html>
