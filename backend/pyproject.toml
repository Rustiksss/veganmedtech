[project]
name = "clinical-compass"
version = "0.1.0"
description = "Локальный сервер Клинического компаса"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "django-allauth[headless]>=65.20,<66",
  "argon2-cffi>=25.1,<26",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<26",
  "whitenoise>=6.12,<7",
]
[dependency-groups]
dev = ["websocket-client>=1.8,<2"]
