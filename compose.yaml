services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compass}
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: veganmedtech-backend:work0008
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      APP_DEV_MODE: ${APP_DEV_MODE:-0}
      APP_TRUST_PROXY: ${APP_TRUST_PROXY:-0}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-compass}
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.test}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_MODEL: ${POLZA_MODEL:-deepseek/deepseek-v4-flash}
      ASSISTANT_ALERTING_MODE: ${ASSISTANT_ALERTING_MODE:-off}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 35s
  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    profiles: [dev]
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
volumes:
  postgres_data:
